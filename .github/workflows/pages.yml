name: Deploy web preview to GitHub Pages

# Publishes the prebuilt static Expo web export that lives on the `gh-pages` branch.
# No app build happens here, so the job is fast and has no npm/expo dependencies.
#
# The first run also enables GitHub Pages for the repository (enablement: true),
# so the preview URL works without a manual Settings change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
